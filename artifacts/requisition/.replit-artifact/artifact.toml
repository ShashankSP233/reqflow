kind = "web"
previewPath = "/"
title = "Requisition Management"
version = "1.0.0"
id = "artifacts/requisition"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21455

[services.development]
run = "pnpm --filter @workspace/requisition run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/requisition", "run", "build" ]
publicDir = "artifacts/requisition/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21455"
BASE_PATH = "/"
